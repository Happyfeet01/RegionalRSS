# Nginx-Reverse-Proxy fuer RegionalRSS.
# Erwartet RegionalRSS auf 127.0.0.1:8787 und ein vorhandenes
# Let's-Encrypt-Zertifikat fuer feeds.dasnetzundich.de.
#
# Datenschutz: Der Access-Log enthaelt weder Client-IP noch Query-Strings
# oder Referer. Der vHost-spezifische Error-Log wird verworfen, weil Nginx
# Fehlerzeilen nicht datenschutzfreundlich anonymisieren kann.
# Dieser log_format-Eintrag muss im http-Kontext stehen.
log_format regionalrss_privacy '[$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;

    server_name feeds.dasnetzundich.de;
    access_log /var/log/nginx/regionalrss_access.log regionalrss_privacy;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name feeds.dasnetzundich.de;

    ssl_certificate /etc/letsencrypt/live/feeds.dasnetzundich.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feeds.dasnetzundich.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/regionalrss_access.log regionalrss_privacy;
    error_log /dev/null crit;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # Keine Roh-IP an RegionalRSS weiterreichen.
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
    }
}
