# Voruebergehende HTTP-Konfiguration fuer die erste Zertifikatsausstellung.
# Danach diese Datei durch regionalrss.conf ersetzen.
#
# Datenschutz: keine Client-IP, keine Query-Strings und kein Referer im Access-Log.
# Der log_format-Eintrag muss im http-Kontext stehen.
log_format regionalrss_privacy '[$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;

    server_name feeds.dasnetzundich.de;
    access_log /var/log/nginx/regionalrss_access.log regionalrss_privacy;
    error_log /dev/null crit;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
