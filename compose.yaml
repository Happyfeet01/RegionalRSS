services:
  regionalrss:
    build:
      context: .
    image: regionalrss:local
    container_name: regionalrss
    restart: unless-stopped
    init: true
    read_only: true
    ports:
      - "127.0.0.1:8787:8080"
    environment:
      REGIONALRSS_PUBLIC_BASE_URL: ${REGIONALRSS_PUBLIC_BASE_URL:-}
      REGIONALRSS_USER_AGENT: ${REGIONALRSS_USER_AGENT:-RegionalRSS/0.2}
      REGIONALRSS_SITE_TITLE: ${REGIONALRSS_SITE_TITLE:-RegionalRSS}
      REGIONALRSS_SOURCES_DIR: /data/sources
      REGIONALRSS_DEFAULT_SOURCES_DIR: /app/default-sources
      REGIONALRSS_CACHE_PATH: /data/cache.sqlite3
      REGIONALRSS_ACCOUNTS_PATH: /data/accounts.sqlite3
      REGIONALRSS_TIMEOUT_SECONDS: ${REGIONALRSS_TIMEOUT_SECONDS:-12}
      REGIONALRSS_MAX_RESPONSE_BYTES: ${REGIONALRSS_MAX_RESPONSE_BYTES:-5242880}
      REGIONALRSS_ALLOW_PRIVATE_HOSTS: "false"
      REGIONALRSS_ADMIN_USER: ${REGIONALRSS_ADMIN_USER:-}
      REGIONALRSS_ADMIN_PASSWORD_HASH: ${REGIONALRSS_ADMIN_PASSWORD_HASH:-}
      REGIONALRSS_SESSION_SECRET: ${REGIONALRSS_SESSION_SECRET:-}
      REGIONALRSS_ALLOW_REGISTRATION: ${REGIONALRSS_ALLOW_REGISTRATION:-true}
      REGIONALRSS_MAX_SOURCES_PER_USER: ${REGIONALRSS_MAX_SOURCES_PER_USER:-20}
      REGIONALRSS_MAIL_FROM: ${REGIONALRSS_MAIL_FROM:-}
      REGIONALRSS_MAIL_FROM_NAME: ${REGIONALRSS_MAIL_FROM_NAME:-RegionalRSS}
      REGIONALRSS_SMTP_HOST: ${REGIONALRSS_SMTP_HOST:-}
      REGIONALRSS_SMTP_PORT: ${REGIONALRSS_SMTP_PORT:-587}
      REGIONALRSS_SMTP_SECURITY: ${REGIONALRSS_SMTP_SECURITY:-starttls}
      REGIONALRSS_SMTP_USER: ${REGIONALRSS_SMTP_USER:-}
      REGIONALRSS_SMTP_PASSWORD: ${REGIONALRSS_SMTP_PASSWORD:-}
      REGIONALRSS_PRIVACY_CONTROLLER_NAME: ${REGIONALRSS_PRIVACY_CONTROLLER_NAME:-}
      REGIONALRSS_PRIVACY_CONTROLLER_ADDRESS: ${REGIONALRSS_PRIVACY_CONTROLLER_ADDRESS:-}
      REGIONALRSS_PRIVACY_EMAIL: ${REGIONALRSS_PRIVACY_EMAIL:-}
      REGIONALRSS_PRIVACY_HOSTING_PROVIDER: ${REGIONALRSS_PRIVACY_HOSTING_PROVIDER:-}
      REGIONALRSS_PRIVACY_MAIL_PROVIDER: ${REGIONALRSS_PRIVACY_MAIL_PROVIDER:-}
      REGIONALRSS_PRIVACY_BACKUP_RETENTION: ${REGIONALRSS_PRIVACY_BACKUP_RETENTION:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - regionalrss_sources:/data/sources
      - regionalrss_data:/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  regionalrss_sources:
  regionalrss_data:
